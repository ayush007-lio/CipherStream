<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Chat v2.0</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
    <div class="app-container">
        <header class="chat-header">
            <h1><i class="fa-solid fa-user-secret"></i> SecureClient <span class="status">Connected</span></h1>
        </header>

        <div class="chat-window">
            <div id="message-log" class="message-log">
                <div class="message system">
                    <p><i class="fa-solid fa-info-circle"></i> Welcome! Enter your username to join.</p>
                </div>
            </div>
        </div>
        
        <div class="input-area">
            <input type="text" id="message-input" placeholder="Enter your username..." autocomplete="off">
            <button id="send-button"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
